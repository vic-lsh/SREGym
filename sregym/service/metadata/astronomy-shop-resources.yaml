# Proven LH resource envelope plus shared-host OpenSearch disk headroom.
# See OpenSearch cluster-settings docs: byte-valued watermarks measure free space.
# Keep all three absolute; flood100gb matches the benchmark host floor.
# Grafana shares one sidecar knob, so it uses the maximum LH sidecar limit.
components:
  accounting:
    resources:
      limits:
        memory: 384Mi
      requests:
        memory: 256Mi
  ad:
    resources:
      limits:
        memory: 576Mi
      requests:
        memory: 300Mi
  cart:
    resources:
      limits:
        memory: 160Mi
      requests:
        memory: 160Mi
  checkout:
    resources:
      limits:
        memory: 128Mi
      requests:
        memory: 20Mi
  currency:
    resources:
      limits:
        memory: 128Mi
      requests:
        memory: 20Mi
  email:
    resources:
      limits:
        memory: 192Mi
      requests:
        memory: 100Mi
  fraud-detection:
    resources:
      limits:
        memory: 576Mi
      requests:
        memory: 300Mi
  frontend:
    resources:
      limits:
        memory: 256Mi
      requests:
        memory: 250Mi
  frontend-proxy:
    resources:
      limits:
        memory: 192Mi
      requests:
        memory: 65Mi
  image-provider:
    resources:
      limits:
        memory: 128Mi
      requests:
        memory: 50Mi
  load-generator:
    resources:
      limits:
        memory: 1500Mi
      requests:
        memory: 1500Mi
    sidecarContainers:
    - name: locust-exporter
      useDefault:
        env: false
      imageOverride:
        repository: containersol/locust_exporter
        tag: v0.5.0
      service:
        port: 9646
      env:
      - name: LOCUST_EXPORTER_URI
        value: http://localhost:8089
      resources:
        limits:
          cpu: 50m
          memory: 128Mi
        requests:
          cpu: 10m
          memory: 32Mi
  payment:
    resources:
      limits:
        memory: 256Mi
      requests:
        memory: 140Mi
  product-catalog:
    resources:
      limits:
        memory: 128Mi
      requests:
        memory: 20Mi
  product-reviews:
    resources:
      limits:
        memory: 192Mi
      requests:
        memory: 100Mi
  quote:
    resources:
      limits:
        memory: 128Mi
      requests:
        memory: 40Mi
  recommendation:
    resources:
      limits:
        memory: 500Mi
      requests:
        memory: 500Mi
  shipping:
    resources:
      limits:
        memory: 128Mi
      requests:
        memory: 128Mi
  flagd:
    resources:
      limits:
        memory: 128Mi
      requests:
        memory: 75Mi
    sidecarContainers:
    - name: flagd-ui
      useDefault:
        env: true
      service:
        port: 4000
      env:
      - name: FLAGD_METRICS_EXPORTER
        value: otel
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://$(OTEL_COLLECTOR_NAME):4318
      - name: FLAGD_UI_PORT
        value: '4000'
      - name: SECRET_KEY_BASE
        value: yYrECL4qbNwleYInGJYvVnSkwJuSQJ4ijPTx5tirGUXrbznFIBFVJdPl5t6O9ASw
      - name: PHX_HOST
        value: localhost
      resources:
        limits:
          memory: 512Mi
        requests:
          memory: 512Mi
      volumeMounts:
      - name: config-rw
        mountPath: /app/data
  kafka:
    resources:
      limits:
        memory: 1152Mi
      requests:
        memory: 600Mi
  llm:
    resources:
      limits:
        memory: 192Mi
      requests:
        memory: '0'
  postgresql:
    resources:
      limits:
        memory: 256Mi
      requests:
        memory: 100Mi
  valkey-cart:
    resources:
      limits:
        memory: 128Mi
      requests:
        memory: 20Mi
opentelemetry-collector:
  resources:
    limits:
      memory: 448Mi
    requests:
      memory: 200Mi
grafana:
  resources:
    limits:
      memory: 384Mi
    requests:
      memory: 175Mi
  sidecar:
    resources:
      limits:
        cpu: 100m
        memory: 256Mi
      requests:
        memory: 100Mi
jaeger:
  jaeger:
    resources:
      limits:
        memory: 600Mi
      requests:
        memory: 600Mi
opensearch:
  resources:
    limits:
      memory: 2240Mi
    requests:
      cpu: '1'
      memory: 100Mi
  config:
    opensearch.yml: '# Shared benchmark filesystem uses an absolute100GiB host floor.

      cluster.name: demo-cluster

      network.host: 0.0.0.0

      cluster.routing.allocation.disk.watermark.low: 130gb

      cluster.routing.allocation.disk.watermark.high: 115gb

      cluster.routing.allocation.disk.watermark.flood_stage: 100gb

      '
